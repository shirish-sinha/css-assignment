<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap');
        *{
            box-sizing: border-box;
        }
        body{
            background-color: #A2A2A2;
        }
        .main{
            background-color: #1C1C1C;
            height: 100vh;
            width: 32vw;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .button{
            width: 100px;
            height: 100px;
            background-color: #505050;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 400;
            font-family: 'Roboto', sans-serif;
            color: white;
        }
        .row{
            display: flex;
            justify-content: space-around;
        }
        #display{
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 120px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="main">
        <div style="height: 200px;" id="display">7744</div>
        <div class="row">
            <div class="button" style="background-color: #A2A2A2; color: black;">C</div>
            <div class="button" style="background-color: #A2A2A2; color: black;">+/-</div>
            <div class="button" style="background-color: #A2A2A2; color: black;">%</div>
            <div class="button" style="background-color: #FF9500; color: white;">÷</div>
        </div>
        <div class="row">
            <div class="button">7</div>
            <div class="button">8</div>
            <div class="button">9</div>
            <div class="button" style="background-color: #FF9500;">X</div>
        </div>
        <div class="row">
            <div class="button">4</div>
            <div class="button">5</div>
            <div class="button">6</div>
            <div class="button" style="background-color: #FF9500;">-</div>
        </div>
        <div class="row">
            <div class="button">1</div>
            <div class="button">2</div>
            <div class="button">3</div>
            <div class="button" style="background-color: #FF9500;">+</div>
        </div>
        <div class="row">
            <div class="button" style="width: 220px; border-radius: 100px; justify-content: flex-start; padding-left: 40px;">0</div>
            <div class="button">,</div>
            <div class="button" style="background-color: #FF9500;">=</div>
        </div>
    </div>
</body>
</html>
