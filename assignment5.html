<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: teal;
            color: white;
        }

        .cont {
            width: 350px;
            height: 275px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        .top{
            font-size: 30px;
            font-weight: 800;
        }
        .middle {
            display: flex;
            gap: 75px;
        }
        .container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }
        h1{
            font-size: 80px;
            margin: 0;
        }
        .balls{
            height: 40px;
            width: 40px;
            background-color: white;
            border-radius: 50%;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bolder;
        }
        .buttons{
            height: 100px;
            width: 100px;
            border: 4px solid white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }
        .bottom{
            display: flex;
            gap: 75px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top">
            <p>SUPER<br>OVER</p>
        </div>
        <div class="middle">
            <div class="cont" style="background-color: #1D59A5;">
                <h1>IND</h1>
                <div style="display: flex; gap: 10px;">
                    <div class="balls">4</div>
                    <div class="balls">3</div>
                    <div class="balls">2</div>
                    <div class="balls">6</div>
                    <div class="balls">6</div>
                    <div class="balls">6</div>
                </div>
                <div style="font-size: 40px; font-weight: 800;">27/0</div>
            </div>
            <div class="cont" style="background-color: #429E2A;">
                <h1>PAK</h1>
                <div style="display: flex; gap: 10px;">
                    <div class="balls">2</div>
                    <div class="balls">4</div>
                    <div class="balls">0</div>
                    <div class="balls">3</div>
                    <div class="balls">1</div>
                    <div class="balls">4</div>
                </div>
                <div style="font-size: 40px; font-weight: 800;">14/0</div>
            </div>
        </div>
        <div class="bottom">
            <div class="buttons" style="background-color: #EEBD44;">🏏</div>
            <div class="buttons" style="background-color: #E73229;">↺</div>
        </div>
    </div>
</body>

</html>
